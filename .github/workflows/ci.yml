name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the image from .devcontainer/ and runs the command inside it,
      # exactly like a contributor's editor does (ADR 0005).
      - name: Build and test in the dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: make test
